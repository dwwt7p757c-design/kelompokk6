<!doctype>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>KELOMPOK 6 — Collection</title>
  <link rel="stylesheet" href="assets/css/storefront.css">
  <script src="assets/js/storefront.js" defer></script>
</head>
<body>
  <header class="header">
    <button class="menu-button" id="menu-open" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
    <a class="brand" href="index.html" aria-label="Kelompok 6">C <span>H</span> M B</a>
    <div class="header-tools">
      <button class="icon-button search-open" aria-label="Cari"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
      <button class="account-button" id="manage-open" aria-label="Kelola produk"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-5 3.5-7 8-7s7.2 2 8 7"/></svg></button>
      <button class="bag-button" id="bag-open" aria-label="Keranjang"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg><span id="bag-count">0</span></button>
    </div>
  </header>

  <main>
    <section class="collection-heading">
      <button class="back-button" onclick="history.length>1?history.back():scrollTo(0,0)" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <h1>Collection</h1>
      <button class="filter-button" id="mobile-filter" aria-label="Filter"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
    </section>

    <section class="shop-toolbar">
      <div class="filters" id="category-filters"></div>
      <label class="sort-control">URUTKAN <select id="sort-select"><option value="featured">Unggulan</option><option value="newest">Terbaru</option><option value="low">Harga: rendah ke tinggi</option><option value="high">Harga: tinggi ke rendah</option><option value="az">Nama: A–Z</option></select></label>
    </section>

    <section class="catalog"><div class="product-grid" id="product-grid"></div><p class="empty-products" id="empty-products" hidden>Produk tidak ditemukan.</p></section>
  </main>

  <div class="overlay" id="overlay"></div>
  <aside class="bag-drawer" id="bag-drawer" aria-hidden="true">
    <div class="drawer-head"><h2>Keranjang <span id="drawer-count">(0)</span></h2><button class="drawer-close close-overlay" aria-label="Tutup">×</button></div>
    <div class="bag-items" id="bag-items"></div>
    <div class="bag-bottom"><div class="subtotal"><span>Subtotal</span><strong id="bag-subtotal">Rp 0</strong></div><p>Pembayaran dan pengiriman dikonfirmasi melalui WhatsApp.</p><button class="checkout-button" id="checkout-button">CHECK OUT VIA WHATSAPP</button></div>
  </aside>

  <dialog class="product-dialog" id="product-dialog"><button class="dialog-close" data-close aria-label="Tutup">×</button><div id="product-dialog-content"></div></dialog>
  <dialog class="manage-dialog" id="manage-dialog"><button class="dialog-close" data-close aria-label="Tutup">×</button><div class="manage-heading"><h2>Kelola Koleksi</h2><p>Tambah atau ubah produk. Perubahan tersimpan pada browser ini.</p></div><div class="manage-actions"><button class="small-button" id="add-product">Tambah produk +</button><button class="small-button" id="export-catalog">Ekspor JSON</button><label class="small-button import-label">Impor JSON<input id="import-catalog" type="file" accept="application/json,.json" hidden></label><button class="reset-button" id="reset-catalog">Reset katalog</button></div><div class="manage-list" id="manage-list"></div></dialog>
  <dialog class="edit-dialog" id="edit-dialog"><button class="dialog-close" data-close aria-label="Tutup">×</button><h2 id="edit-title">Tambah produk</h2><form id="product-form" class="product-form"><input type="hidden" id="product-id"><label>Nama produk<input id="field-name" required></label><label>Kategori<input id="field-category" required></label><label>Harga Rp<input id="field-price" type="number" min="0" step="1000" required></label><label>Harga lama (opsional)<input id="field-compare" type="number" min="0" step="1000"></label><label>URL gambar produk<input id="field-image" type="url" required placeholder="https://..."></label><label>Deskripsi<textarea id="field-description" rows="3"></textarea></label><label class="check"><input id="field-featured" type="checkbox"> Produk unggulan</label><div class="form-buttons"><button type="button" class="small-button" data-close>Batal</button><button class="small-button dark">Simpan</button></div></form></dialog>

  <div class="search-panel" id="search-panel"><button class="search-close close-search" aria-label="Tutup">×</button><input id="search-input" type="search" placeholder="Search" autocomplete="off"><div id="search-results" class="search-results"></div></div>
  <nav class="mobile-menu" id="mobile-menu"><button class="menu-close close-menu" aria-label="Tutup">×</button><a href="index.html">Home</a><a href="index.html">Shop</a><a href="index.html">Collection</a><a href="mailto:hello@kelompok6.com">Contact</a></nav>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
